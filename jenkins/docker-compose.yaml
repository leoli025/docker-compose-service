version: '3.8'

services:
  jenkins:
    image: jenkinsci/blueocean:latest
    container_name: jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - ./data:/var/jenkins_home
#      - /var/run/docker.sock:/var/run/docker.sock
#      - /usr/local/bin/docker:/usr/bin/docker
    environment:
      - TZ=Asia/Shanghai
    networks:
      - jenkins_net

networks:
  jenkins_net:
    driver: bridge